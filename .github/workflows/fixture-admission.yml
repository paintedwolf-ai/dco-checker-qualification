name: Fixture admission
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Disposable unsigned PR to admit for negative merge-group qualification
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  checks: write
concurrency:
  group: dco-certification
  queue: max
  cancel-in-progress: false
jobs:
  admit:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish test-only admission
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'paintedwolf-ai/dco-checker-qualification'
          number = os.environ['PR_NUMBER']
          assert re.fullmatch(r'[1-9][0-9]*', number)
          def api(path, payload=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + '/' + path,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)
          pr = api('pulls/' + number)
          assert pr['state'] == 'open' and not pr['draft']
          check = api('check-runs', {'name':'DCO-owned', 'head_sha':pr['head']['sha'],
              'status':'completed', 'conclusion':'success',
              'external_id':'fixture-admission:' + os.environ['GITHUB_RUN_ID'],
              'output':{'title':'TEST ONLY: negative queue admission',
                        'summary':'This is intentionally not DCO certification. A reviewed fixture publisher admits an unsigned original commit only to demonstrate that the real merge-group checker rejects it. Never install this workflow in production.'}})
          print('Test-only admission check:', check['id'], 'PR:', number)
          PY
