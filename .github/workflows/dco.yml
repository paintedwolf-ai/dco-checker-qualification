name: DCO
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Ready pull request number
        required: true
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write
  statuses: write
concurrency:
  group: dco-certification
  queue: max
  cancel-in-progress: false
jobs:
  certify:
    if: (github.event_name != 'pull_request_target' || (github.event.pull_request.draft == false && github.actor != 'dependabot[bot]')) && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Record disposable qualification event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY_EVENT'
          import json, os, urllib.request
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          print("DCO_QUALIFICATION_EVENT=" + json.dumps(event, sort_keys=True))
          if os.environ["GITHUB_EVENT_NAME"] == "merge_group":
              owner, name = os.environ["GITHUB_REPOSITORY"].split("/")
              ref = event["merge_group"]["base_ref"]
              branch = ref.removeprefix("refs/heads/")
              query = "query($owner:String!,$name:String!,$ref:String!,$branch:String!){repository(owner:$owner,name:$name){baseRef:ref(qualifiedName:$ref){target{...on Commit{oid}}}mergeQueue(branch:$branch){entries(first:100){totalCount pageInfo{hasNextPage endCursor}nodes{id baseCommit{oid}headCommit{oid}pullRequest{number state isDraft baseRefName baseRefOid headRefOid}}}}}}"
              request = urllib.request.Request("https://api.github.com/graphql", data=json.dumps({"query":query,"variables":{"owner":owner,"name":name,"ref":ref,"branch":branch}}).encode(), headers={"Authorization":"Bearer " + os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  inventory = json.load(response)
              print("DCO_QUALIFICATION_QUEUE=" + json.dumps(inventory, sort_keys=True))
          PY_EVENT
      - name: Certify original PR commits
        uses: paintedwolf-ai/dco-checker@078de1f268e518b21b4e71e57f7e4ad24c3d5ff3
